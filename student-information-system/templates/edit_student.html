
{% extends "base.html" %}

{% block title %}Edit Student | Student SIS{% endblock %}
{% block heading %}Edit Student{% endblock %}

{% block content %}

<div class="panel form-panel">

    <div class="panel-header">
        <h2>Update Student Information</h2>
    </div>

    <form method="POST"
          action="{{ url_for('edit_student', id=student.id) }}">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        {% include "student_form.html" %}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Update Student
            </button>

            <a href="{{ url_for('students') }}" class="btn btn-outline">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
